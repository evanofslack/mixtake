[project]
name = "mixtake-analyzer"
version = "0.1.0"
description = "Essentia audio analyzer sidecar for mixtake"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "essentia-tensorflow>=2.1b6.dev1389",
    "fastapi>=0.162.2",
    "numpy>=2.5.4",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.uv]
package = false
# essentia-tensorflow only ships wheels for these
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# TestClient still works with httpx; httpx2 is not needed yet
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
